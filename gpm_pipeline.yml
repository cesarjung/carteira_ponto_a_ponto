name: Pipeline GPM (07h, 12h, 15h)

on:
  schedule:
    # 07:00 BRT (UTC-3) -> 10:00 UTC
    - cron: "0 10 * * *"
    # 12:00 BRT -> 15:00 UTC
    - cron: "0 15 * * *"
    # 15:00 BRT -> 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install google-api-python-client google-auth; fi

      - name: ✅ Rodar import_gpm.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python import_gpm.py

      - name: ⏱️ Aguardar 5 minutos
        run: sleep 300

      - name: ✅ Rodar import_gpm_atividades.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python import_gpm_atividades.py

      - name: ✅ Rodar import_gpm_materiais.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python import_gpm_materiais.py
